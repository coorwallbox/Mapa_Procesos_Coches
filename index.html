<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de procesos — ISO 9001</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Contenedor raíz del mapa; el iframe de SharePoint solo mostrará esto -->
  <main class="process-map" id="processMap">
    <header class="map-header">
      <p class="map-eyebrow">Sistema de Gestión de Calidad</p>
      <h1 class="map-title">Mapa de procesos los coches 2026</h1>
      <p class="map-subtitle">Norma ISO 9001 — clic en una banda para desplegar sus procesos</p>
    </header>

    <!-- Layout de 3 columnas: tarjeta lateral / bandas / tarjeta lateral.
         Las tarjetas de "Partes interesadas" se posicionan en vivo desde script.js
         para quedar a la altura del centro de su banda ancla. -->
    <div class="map-layout" id="mapLayout">
      <aside class="stakeholder-card" id="stakeholderLeft" aria-label="Solicitudes partes interesadas"></aside>

      <!-- Las bandas se inyectan desde script.js a partir del objeto de datos -->
      <section class="map-bands" id="mapBands" aria-label="Bandas de procesos"></section>

      <aside class="stakeholder-card" id="stakeholderRight" aria-label="Satisfacción partes interesadas"></aside>
    </div>
  </main>

  <!-- Ficha de detalle de proceso (Fase 2): panel lateral deslizante.
       Solo se abre para procesos con datos de detalle (Misionales/Apoyo, por ahora).
       Contenido inyectado desde script.js; oculto por defecto. -->
  <div class="detail-overlay" id="detailOverlay" hidden></div>
  <aside class="detail-panel" id="detailPanel" aria-hidden="true" aria-label="Detalle del proceso">
    <button type="button" class="detail-close" id="detailClose" aria-label="Cerrar detalle">&times;</button>
    <div class="card-icon-wrap" id="detailIconWrap"></div>
    <h2 class="detail-title" id="detailTitle"></h2>
    <div class="detail-field">
      <span class="detail-label">Descripción</span>
      <p class="detail-value" id="detailDescription"></p>
    </div>
    <div class="detail-field">
      <span class="detail-label">Responsable</span>
      <p class="detail-value" id="detailResponsible"></p>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
